name: measure bench

# On demand only: wall-clock time of the emitted Rust parser at two commits (D = baseline,
# E = commit) beside oxc (C), alternating rounds in ONE job per mode (test/bench-rust-oxc/run.sh),
# medians and per-round ratios in the job summary. Wall-clock ratios between jobs are not
# comparable (runner hardware moved one commit's ratio to oxc by 25-40% between two runs); within
# a job, moves up to 5% without instruction-count support have been code-layout noise. So this
# never runs on every push: the deterministic measure-profile workflow does. Modes: reuse (one
# CstBuilder kept / one oxc Allocator reset() before each parse: the like-for-like comparison) and
# fresh (a new one per parse), each in its own job.
#
# - workflow_dispatch: commit, baseline, grammar, mode, rounds.
# - a pull request labelled `measure-bench`: E = its head, D = its merge base, typescript grammar,
#   both modes, 9 rounds (remove and re-add the label to measure again).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'E: the commit to time (sha, branch or tag)'
        required: true
      baseline:
        description: 'D: the commit to time it against (default: its merge base with origin/master)'
        required: false
        default: ''
      grammar:
        description: 'grammar file every variant emits'
        type: choice
        options: [typescript, javascript]
        default: typescript
      mode:
        description: 'builder / allocator mode'
        type: choice
        options: [both, reuse, fresh]
        default: both
      rounds:
        description: 'alternating rounds'
        default: '9'
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  TS_REPO_SHA: '6fbce89821d93a5b761581d9ac540455f38e9acb'

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [reuse, fresh]
    steps:
      - name: Is this mode asked for?
        id: want
        env:
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$IN_MODE" ] || [ "$IN_MODE" = both ] || [ "$IN_MODE" = '${{ matrix.mode }}' ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; echo "mode ${{ matrix.mode }} not asked for"; fi

      - uses: actions/checkout@v5
        if: steps.want.outputs.value == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.want.outputs.value == 'true'
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.value == 'true'

      - name: Choose D and E
        if: steps.want.outputs.value == 'true'
        id: de
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_COMMIT: ${{ inputs.commit }}
          IN_BASELINE: ${{ inputs.baseline }}
          IN_GRAMMAR: ${{ inputs.grammar }}
          IN_ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          git fetch -q origin master
          resolve() { git fetch -q origin "$1" 2>/dev/null || true; git rev-parse "$1^{commit}" 2>/dev/null || git rev-parse "origin/$1^{commit}"; }
          if [ "$EVENT" = pull_request ]; then
            E=$PR_HEAD; D=$(git merge-base "$PR_BASE" "$PR_HEAD"); grammar=typescript; rounds=9
          else
            E=$(resolve "$IN_COMMIT")
            if [ -n "$IN_BASELINE" ]; then D=$(resolve "$IN_BASELINE"); else D=$(git merge-base origin/master "$E"); fi
            grammar=$IN_GRAMMAR; rounds=$IN_ROUNDS
          fi
          case $rounds in ''|*[!0-9]*) echo "rounds must be a number"; exit 1;; esac
          { echo "D=$D"; echo "E=$E"; echo "grammar=$grammar"; echo "rounds=$rounds"; echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')"; } >> "$GITHUB_OUTPUT"

      # The oxc crate: the registry and its target directory, keyed on its lockfile and the compiler.
      - uses: actions/cache@v4
        if: steps.want.outputs.value == 'true'
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/oxc-target
          key: oxc-bench-${{ runner.os }}-${{ hashFiles('test/oxc-parse-bench/Cargo.lock', 'test/oxc-parse-bench/Cargo.toml') }}-${{ steps.de.outputs.rustc }}
          restore-keys: |
            oxc-bench-${{ runner.os }}-${{ hashFiles('test/oxc-parse-bench/Cargo.lock', 'test/oxc-parse-bench/Cargo.toml') }}-

      - if: steps.want.outputs.value == 'true'
        run: npm ci

      - name: Time D and E beside oxc
        if: steps.want.outputs.value == 'true'
        run: set -o pipefail; test/bench-rust-oxc/run.sh "${{ steps.de.outputs.rounds }}" | tee "${{ runner.temp }}/bench.log"
        env:
          BENCH_WORK: ${{ runner.temp }}/bench-work
          OXC_TARGET_DIR: ${{ runner.temp }}/oxc-target
          BENCH_BASE: ${{ steps.de.outputs.D }}
          BENCH_EXTRA: ${{ steps.de.outputs.E }}
          BENCH_GRAMMAR: ${{ steps.de.outputs.grammar }}
          BENCH_MODE: ${{ matrix.mode }}

      - name: Job summary
        if: steps.want.outputs.value == 'true'
        env:
          D: ${{ steps.de.outputs.D }}
          E: ${{ steps.de.outputs.E }}
          GRAMMAR: ${{ steps.de.outputs.grammar }}
          ROUNDS: ${{ steps.de.outputs.rounds }}
        run: |
          set -euo pipefail
          L='${{ runner.temp }}/bench.log'
          {
            echo "## Rust wall-clock, mode ${{ matrix.mode }}: E vs D vs oxc (C), $GRAMMAR grammar, $ROUNDS alternating rounds"
            echo
            echo "- D = $(git log -1 --format='`%h` %s' "$D")"
            echo "- E = $(git log -1 --format='`%h` %s' "$E")"
            echo "- C = oxc_parser $(grep -m1 -A1 'name = "oxc_parser"' test/oxc-parse-bench/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
            echo "- runner: $(lscpu | sed -n 's/^Model name: *//p')"
            echo
            echo 'Ratios are time ratios (> 1 = the first is slower), medians of per-round ratios, ranges beside them. Only ratios within this one job compare; a move under 5% without an instruction-count change (measure-profile) is not evidence.'
            echo
            echo '```'
            sed -n '/^### per-round time ratios/,$p' "$L"
            echo '```'
            echo
            echo '<details><summary>per-input tables (ms/parse, MB/s per round)</summary>'
            echo
            echo '```'
            sed -n '/^=== summary/,/^### per-round time ratios/p' "$L"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
