name: measure targets

# DIAGNOSTIC BRANCH ONLY (never merged): test/bench-targets/diag-v8.sh, ts parseWith of D and E
# under several node flag sets, plus deopt / pretenuring / GC traces.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'E'
        required: true
      baseline:
        description: 'D'
        required: false
        default: ''
      grammar:
        type: choice
        options: [typescript, javascript]
        default: typescript
      only:
        default: ''
      rounds:
        default: '7'

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Diagnose
        env:
          DIAG_BASE: ${{ inputs.baseline }}
          DIAG_COMMIT: ${{ inputs.commit }}
          DIAG_ROUNDS: ${{ inputs.rounds }}
        run: |
          set -o pipefail
          git fetch -q origin master
          bash test/bench-targets/diag-v8.sh | tee "$RUNNER_TEMP/diag.log"
          { echo '```'; sed -n '/^=== medians/,$p' "$RUNNER_TEMP/diag.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: diag-traces
          path: ${{ runner.temp }}/diag-traces.tgz
