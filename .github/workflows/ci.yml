name: CI

on:
  # `land/**`: a branch pushed for the full check before it is put on master WITHOUT a pull
  # request (a pull request notifies every subscriber; most changes are not news). It is checked
  # as a pull request would be: path gates against its merge base with master, caches restored.
  push:
    branches: [master, 'land/**']
  pull_request:
  # Nightly + on-demand FULL run: the tree-sitter job below only generates when tree-sitter/**
  # changed (the materialized grammar is its sole input), so these backstop the one input it can't
  # see in that diff — a tree-sitter-cli bump (lockfile) — and re-verify the "beats official" claim.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The pinned TypeScript conformance corpus: the emit-parity breadth gates (and others) read it at /tmp/ts-repo (same pin as the readme-bench workflow).
env:
  TS_REPO_SHA: '6fbce89821d93a5b761581d9ac540455f38e9acb'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Node 24+ runs the .ts sources directly (native type stripping) — no build, no tsx.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # One pinned Go toolchain for the Go gates (the same one docs/ALLOCATIONS.md's report is made
      # with, not the image's preinstalled Go).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - run: npm ci

      # Regenerate every grammar's artifacts FIRST: the uncommitted one
      # (*.cst-match.ts, gitignored) must exist before Typecheck
      # and the gates, which import it. Then fail if any COMMITTED artifact
      # drifts from the regenerated output (someone edited a grammar but forgot
      # to regenerate). Covers all grammars (sources at the repo root) + the
      # tree-sitter packages.
      - name: Generate editor artifacts (committed ones must be in sync)
        # By changed inputs (test/gen-changed.ts): on a land/** branch or a pull request only the
        # `npm run gen` steps whose derived inputs changed since the merge base with master run (the
        # others' committed artifacts are what they would write); master pushes, the nightly and a
        # dispatch regenerate everything. Every step that runs is traced: one that reads a file its
        # derived inputs lack fails the step (what keeps a skip sound).
        run: |
          # Each step that runs is timed (report-only: wall and CPU seconds and peak memory per step,
          # the generators' cost; a skipped step prints "skipped"); read with
          # `gh run view <id> --log | grep 'generate '` (the CPU line says which runner it was).
          echo "generate runner CPU:$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2), $(nproc) cores"
          if [ "${{ github.ref }}" = refs/heads/master ] || [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            GEN_TRACE_DEPS=1 node test/gen-changed.ts --all
          else
            git fetch -q --filter=blob:none --unshallow origin master || git fetch -q origin master
            GEN_TRACE_DEPS=1 node test/gen-changed.ts origin/master
          fi
          git diff --exit-code -- '*.tmLanguage.json' '*.language-configuration.json' '*.monarch.json' '*.contributes.json' tree-sitter docs/COMPLETENESS.md docs/decisions test/fixtures/decisionsjs.decisions.md

      - name: Typecheck
        run: npx tsc --noEmit

      # Gates that read this corpus say NOT RUN and fail without it.
      - name: Clone the pinned TS corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/ts-repo; mkdir -p /tmp/ts-repo
          git -C /tmp/ts-repo init -q
          git -C /tmp/ts-repo remote add origin https://github.com/microsoft/TypeScript
          git -C /tmp/ts-repo config core.sparseCheckout true
          printf 'tests/cases/\n' > /tmp/ts-repo/.git/info/sparse-checkout
          git -C /tmp/ts-repo fetch -q --depth 1 --filter=blob:none origin "$TS_REPO_SHA"
          git -C /tmp/ts-repo checkout -q FETCH_HEAD

      # conformance/test262 parses test262's syntax tests (test/language, test/annexB/language) at the
      # pin in test/test262.sha (the one place the commit is stated; readme-bench reads it too);
      # without the checkout the gate says NOT RUN and fails.
      - name: Clone the pinned test262 corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/test262; mkdir -p /tmp/test262
          git -C /tmp/test262 init -q
          git -C /tmp/test262 remote add origin https://github.com/tc39/test262
          git -C /tmp/test262 config core.sparseCheckout true
          printf 'test/language/\ntest/annexB/language/\n' > /tmp/test262/.git/info/sparse-checkout
          git -C /tmp/test262 fetch -q --depth 1 --filter=blob:none origin "$(cat test/test262.sha)"
          git -C /tmp/test262 checkout -q FETCH_HEAD

      # Every correctness GATE through ONE runner — sanity / agnostic / conformance /
      # highlighter / yaml / the generative scope≡role check / the gap-ledger selftest
      # + --check (stale docs/KNOWN-GAPS.md fails). One ✓/✗ summary, one exit code. The comparative
      # METRICS (scope-gap / src-coverage) and BENCH tools need the external TS corpus / VS Code
      # grammars and run in the readme-bench workflow, not here. See docs/TESTING.md for the taxonomy.
      # CHECK_TRACE_DEPS: every gate also lists the repository files it opened, and the run fails
      # when one is not among the inputs test/gate-deps.ts derives for it (what `check.ts --changed`
      # trusts to skip a gate). nproc: the runner pool takes one gate per core.
      # The commit test/emit-corpus.ts reads the repository's own sources from (test/corpus-pin.ts),
      # fetched once here, before the gates: gates running at once must not each fetch into this clone.
      - name: Fetch the pinned in-repo corpus commit
        run: node test/corpus-pin.ts --fetch

      - name: Test
        env:
          CHECK_TRACE_DEPS: '1'
          CHECK_OUT_DIR: /tmp/gate-output
        run: |
          echo "cores: $(nproc)"
          npm run check
      # every gate's whole output (check.ts prints only a passing gate's last line)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: /tmp/gate-output
          retention-days: 14

  # Engine-parity BREADTH guard. The `test` job already runs the three parity gates
  # (emit-parser-verify / emit-reject-messages / emit-lexer-verify) on the corpus-free
  # in-repo corpus — that is the standing mechanism that forces a gen-parser change to
  # propagate to emit-parser. This job adds the full external TS corpus for breadth, so a
  # divergence on some construct the in-repo corpus does not exercise still gets caught.
  # Gated on parser/grammar changes (like the treesitter job) so it doesn't clone the
  # corpus on doc-only pushes; schedule / workflow_dispatch force the full run.
  emit-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need history to diff against the base for the path gate below

      - name: Did the parser/grammar inputs change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "forced full run (${{ github.event_name }})"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          # A `land/**` branch is judged against its merge base with master, as a pull request is.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            git fetch -q origin master; base="$(git merge-base origin/master HEAD || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "no usable base — running the gate"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^src/|^[^/]+\.ts$|^test/emit-'; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "parser/grammar changed — running the breadth gate"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"; echo "no parser/grammar change — skipping the corpus clone"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.value == 'true'
        with:
          node-version: 24

      # One pinned Go toolchain for the Go gates (the same one docs/ALLOCATIONS.md's report is made
      # with, not the image's preinstalled Go).
      - uses: actions/setup-go@v5
        if: steps.changed.outputs.value == 'true'
        with:
          go-version: '1.27.4'
          cache: false
      - if: steps.changed.outputs.value == 'true'
        run: npm ci

      # Pinned-SHA, shallow, sparse clone of the TS conformance corpus to the fixed path the
      # parity gates auto-detect (same pin + technique as the readme-bench workflow).
      - name: Clone the pinned TS corpus
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/ts-repo; mkdir -p /tmp/ts-repo
          git -C /tmp/ts-repo init -q
          git -C /tmp/ts-repo remote add origin https://github.com/microsoft/TypeScript
          git -C /tmp/ts-repo config core.sparseCheckout true
          printf 'tests/cases/\n' > /tmp/ts-repo/.git/info/sparse-checkout
          git -C /tmp/ts-repo fetch -q --depth 1 --filter=blob:none origin "$TS_REPO_SHA"
          git -C /tmp/ts-repo checkout -q FETCH_HEAD

      - name: Engine-parity over the full corpus
        if: steps.changed.outputs.value == 'true'
        run: |
          node test/corpus-pin.ts --fetch
          node test/emit-parser-verify.ts all
          node test/emit-reject-messages.ts
          node test/emit-lexer-verify.ts

  # The derived tree-sitter highlighter is the strongest thesis proof (a real GLR
  # parser from the same grammar, beating the official hand-written one). Build its
  # wasm and gate the accuracy so the 95.9% is verified, not just claimed. The
  # tree-sitter CLI bundles its own wasm toolchain — no emscripten/docker needed.
  # conformance/cpython: python.ts (the second language, docs/SECOND-LANGUAGE.md) against ast.parse of
  # Python 3.10.12 over CPython's Lib/ at the pin in test/cpython.sha. Its own job, not a gate of
  # test/check.ts: it needs a Python of exactly that version, downloaded here, and a failure to get
  # one must not fail the `test` job. Gated on its inputs (the grammar, the engine, the harness).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need history to diff against the base for the path gate below

      - name: Did the Python conformance inputs change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "forced full run (${{ github.event_name }})"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            git fetch -q origin master; base="$(git merge-base origin/master HEAD || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "no usable base — running the check"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^src/|^python\.ts$|^test/cpython|^\.github/workflows/ci\.yml$'; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "grammar / engine / harness changed — running the check"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"; echo "no input of the check changed — skipping"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.value == 'true'
        with:
          node-version: 24
      - if: steps.changed.outputs.value == 'true'
        run: npm ci

      # The oracle. uv (astral-sh/setup-uv, pinned by commit; uv itself pinned by version) installs
      # CPython 3.10.12 as built by python-build-standalone (github.com/astral-sh/python-build-standalone,
      # the build uv's managed-Python list names for 3.10.12); the interpreter is cached between runs.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        if: steps.changed.outputs.value == 'true'
        with:
          version: '0.13.7'
          enable-cache: true
          cache-python: true
      - name: Python 3.10.12
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          uv python install 3.10.12
          echo "MONOGRAM_PYTHON=$(uv python find 3.10.12)" >> "$GITHUB_ENV"

      - name: Clone the pinned CPython corpus
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/cpython; mkdir -p /tmp/cpython
          git -C /tmp/cpython init -q
          git -C /tmp/cpython remote add origin https://github.com/python/cpython
          git -C /tmp/cpython config core.sparseCheckout true
          printf 'Lib/\n' > /tmp/cpython/.git/info/sparse-checkout
          git -C /tmp/cpython fetch -q --depth 1 --filter=blob:none origin "$(cat test/cpython.sha)"
          git -C /tmp/cpython checkout -q FETCH_HEAD

      - name: conformance/cpython
        if: steps.changed.outputs.value == 'true'
        run: node --stack-size=7000 test/cpython.ts

  treesitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need history to diff against the base for the path gate below

      # `tree-sitter generate` is ~5 min for the TS grammar (issue #46: the state count is at the
      # floor for a unified-grammar-derived parser, so the cost is irreducible) — but the generated
      # parser is a PURE FUNCTION of the committed tree-sitter/** (grammar.js + scanner.c + queries),
      # and the `test` job fails if those drift from the grammar sources, so EVERY grammar change
      # necessarily lands as a tree-sitter/** diff. Re-running generate when nothing under
      # tree-sitter/** changed is pure waste, so gate the expensive steps on it. The job still RUNS
      # (reports success) — only the steps are skipped — so a required status check is never pending.
      # schedule / workflow_dispatch force the full run regardless (the lockfile/cli-bump backstop).
      - name: Did the tree-sitter inputs change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "forced full run (${{ github.event_name }})"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          # A `land/**` branch is judged against its merge base with master, as a pull request is.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            git fetch -q origin master; base="$(git merge-base origin/master HEAD || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "no usable base — running the gate"; exit 0
          fi
          # tree-sitter/** (the generated packages), the tree-sitter gates themselves, or this workflow.
          if git diff --name-only "$base" HEAD | grep -qE '^tree-sitter/|^test/(treesitter-|[a-z]+-treesitter\.ts)|^\.github/workflows/ci\.yml$'; then
            echo "value=true" >> "$GITHUB_OUTPUT"; echo "tree-sitter inputs changed — running the gate"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"; echo "no tree-sitter input change — skipping generate/build/bench"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.value == 'true'
        with:
          node-version: 24
      - if: steps.changed.outputs.value == 'true'
        run: npm ci

      # The generated parser and its wasm are a PURE FUNCTION of the grammar package's grammar.js,
      # scanner.c and tree-sitter.json (it selects the ABI) and of the tree-sitter-cli version (package-lock.json): one cache entry per grammar
      # under that key, so a PR that changes one grammar's package regenerates that grammar only
      # (generating typescript / typescriptreact costs about 12 min each). A hit carries the same
      # parser.c the conflict gate would produce, so skipping it is sound. schedule /
      # workflow_dispatch never restore (the full-run backstop). The /usr/bin/time record rides
      # along so the summary still shows the cost of the generation it came from.
      - uses: actions/cache@v4
        id: ts-typescript
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/typescript/src/parser.c
            tree-sitter/typescript/src/grammar.json
            tree-sitter/typescript/src/node-types.json
            tree-sitter/typescript/src/tree_sitter
            tree-sitter/typescript/tree-sitter-typescript.wasm
            /tmp/time-typescript.txt
          key: ts-gen-typescript-${{ hashFiles('tree-sitter/typescript/grammar.js', 'tree-sitter/typescript/src/scanner.c', 'tree-sitter/typescript/tree-sitter.json', 'package-lock.json') }}
      - uses: actions/cache@v4
        id: ts-typescriptreact
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/typescriptreact/src/parser.c
            tree-sitter/typescriptreact/src/grammar.json
            tree-sitter/typescriptreact/src/node-types.json
            tree-sitter/typescriptreact/src/tree_sitter
            tree-sitter/typescriptreact/tree-sitter-typescriptreact.wasm
            /tmp/time-typescriptreact.txt
          key: ts-gen-typescriptreact-${{ hashFiles('tree-sitter/typescriptreact/grammar.js', 'tree-sitter/typescriptreact/src/scanner.c', 'tree-sitter/typescriptreact/tree-sitter.json', 'package-lock.json') }}
      - uses: actions/cache@v4
        id: ts-javascript
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/javascript/src/parser.c
            tree-sitter/javascript/src/grammar.json
            tree-sitter/javascript/src/node-types.json
            tree-sitter/javascript/src/tree_sitter
            tree-sitter/javascript/tree-sitter-javascript.wasm
            /tmp/time-javascript.txt
          key: ts-gen-javascript-${{ hashFiles('tree-sitter/javascript/grammar.js', 'tree-sitter/javascript/src/scanner.c', 'tree-sitter/javascript/tree-sitter.json', 'package-lock.json') }}
      - uses: actions/cache@v4
        id: ts-javascriptreact
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/javascriptreact/src/parser.c
            tree-sitter/javascriptreact/src/grammar.json
            tree-sitter/javascriptreact/src/node-types.json
            tree-sitter/javascriptreact/src/tree_sitter
            tree-sitter/javascriptreact/tree-sitter-javascriptreact.wasm
            /tmp/time-javascriptreact.txt
          key: ts-gen-javascriptreact-${{ hashFiles('tree-sitter/javascriptreact/grammar.js', 'tree-sitter/javascriptreact/src/scanner.c', 'tree-sitter/javascriptreact/tree-sitter.json', 'package-lock.json') }}
      - uses: actions/cache@v4
        id: ts-html
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/html/src/parser.c
            tree-sitter/html/src/grammar.json
            tree-sitter/html/src/node-types.json
            tree-sitter/html/src/tree_sitter
            tree-sitter/html/tree-sitter-html.wasm
            /tmp/time-html.txt
          key: ts-gen-html-${{ hashFiles('tree-sitter/html/grammar.js', 'tree-sitter/html/src/scanner.c', 'tree-sitter/html/tree-sitter.json', 'package-lock.json') }}
      - uses: actions/cache@v4
        id: ts-yaml
        if: steps.changed.outputs.value == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          path: |
            tree-sitter/yaml/src/parser.c
            tree-sitter/yaml/src/grammar.json
            tree-sitter/yaml/src/node-types.json
            tree-sitter/yaml/src/tree_sitter
            tree-sitter/yaml/tree-sitter-yaml.wasm
            /tmp/time-yaml.txt
          key: ts-gen-yaml-${{ hashFiles('tree-sitter/yaml/grammar.js', 'tree-sitter/yaml/src/scanner.c', 'tree-sitter/yaml/tree-sitter.json', 'package-lock.json') }}

      # Conflict gate: `tree-sitter generate` for every derived grammar IN PARALLEL (was sequential
      # ~12 min; parallel ≈ the slowest single grammar, ts/tsx ~5 min). A conflict introduced by a
      # grammar change is caught even for the dialects whose wasm is not built below (tsx/js/jsx) —
      # exactly the gap that once let an unresolved `type`/`class_heritage` conflict ship. yaml
      # included (issue #3): its indent/scalar externals + C scanner make it generate + build.
      - name: Generate every derived tree-sitter grammar (parallel conflict gate)
        if: steps.changed.outputs.value == 'true'
        run: |
          langs=(typescript typescriptreact javascript javascriptreact html yaml)
          pids=()
          declare -A hit=( [typescript]='${{ steps.ts-typescript.outputs.cache-hit }}' [typescriptreact]='${{ steps.ts-typescriptreact.outputs.cache-hit }}'
                           [javascript]='${{ steps.ts-javascript.outputs.cache-hit }}' [javascriptreact]='${{ steps.ts-javascriptreact.outputs.cache-hit }}'
                           [html]='${{ steps.ts-html.outputs.cache-hit }}' [yaml]='${{ steps.ts-yaml.outputs.cache-hit }}' )
          for g in "${langs[@]}"; do
            if [ "${hit[$g]}" = "true" ]; then echo "· $g: cached (grammar.js, scanner.c and tree-sitter-cli unchanged)"; ( exit 0 ) & pids+=($!); continue; fi
            # /usr/bin/time records wall, CPU and peak memory per grammar (report-only: the jobs run
            # in parallel on a 2-core runner, so wall time includes contention; CPU seconds less so).
            ( cd "tree-sitter/$g" && /usr/bin/time -f '%e %U %S %M' -o "/tmp/time-$g.txt" npx tree-sitter generate ) >"/tmp/gen-$g.log" 2>&1 &
            pids+=($!)
          done
          fail=0
          declare -A failed=()
          for i in "${!langs[@]}"; do
            if wait "${pids[$i]}"; then echo "✓ ${langs[$i]}"; else echo "✗ ${langs[$i]}"; cat "/tmp/gen-${langs[$i]}.log"; fail=1; failed[${langs[$i]}]=1; fi
          done
          # Baseline numbers for the editor lane's tree-sitter changes: generate cost and parser size.
          {
            echo "### tree-sitter generate (report-only baseline)"
            echo ""
            echo "Cached grammars show the numbers of the run that generated them."
            echo ""
            echo "| grammar | wall s (parallel) | CPU user+sys s | peak RSS MB | STATE_COUNT | LARGE_STATE_COUNT | SYMBOL_COUNT | parser.c MB |"
            echo "|---|---:|---:|---:|---:|---:|---:|---:|"
            for g in "${langs[@]}"; do
              # A failed generate has no parser.c of this run (and time(1) prefixes its exit status line).
              if [ -n "${failed[$g]:-}" ]; then echo "| $g | generate failed | | | | | | |"; continue; fi
              read -r wall usr sys rss < <(tail -n1 "/tmp/time-$g.txt") || true
              pc="tree-sitter/$g/src/parser.c"
              def() { grep -m1 -oE "^#define $1 [0-9]+" "$pc" | awk '{print $3}'; }
              echo "| $g | $wall | $(awk "BEGIN{print $usr+$sys}") | $((rss / 1024)) | $(def STATE_COUNT) | $(def LARGE_STATE_COUNT) | $(def SYMBOL_COUNT) | $(awk "BEGIN{printf \"%.1f\", $(stat -c %s "$pc")/1048576}") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

      # Build the gated wasms FROM the parser.c just generated (no re-generate) and run the accuracy
      # benches: ts must beat official (the thesis proof), html vs parse5. The YAML wasm proves its C
      # indentation scanner compiles + links and runs a corpus-free verdict gate against the
      # interpreter; its accuracy bench needs the yaml-test-suite checkout, so it runs in the
      # readme-bench workflow.
      # tsx / js / jsx are built too: their queries are compiled against them (treesitter-queries)
      # and every TS / JS dialect parses its corpora against the interpreter (treesitter-verdicts).
      # The real-code corpora of treesitter-verdicts: TypeScript's own src/ at TS_REPO_SHA and test262's
      # syntax tests at test/test262.sha, the pins the test job's conformance gates clone.
      - name: Clone the pinned real-code corpora (TypeScript src, test262)
        if: steps.changed.outputs.value == 'true'
        run: |
          rm -rf /tmp/ts-repo; mkdir -p /tmp/ts-repo
          git -C /tmp/ts-repo init -q
          git -C /tmp/ts-repo remote add origin https://github.com/microsoft/TypeScript
          git -C /tmp/ts-repo config core.sparseCheckout true
          printf 'src/\n' > /tmp/ts-repo/.git/info/sparse-checkout
          git -C /tmp/ts-repo fetch -q --depth 1 --filter=blob:none origin "$TS_REPO_SHA"
          git -C /tmp/ts-repo checkout -q FETCH_HEAD
          rm -rf /tmp/test262; mkdir -p /tmp/test262
          git -C /tmp/test262 init -q
          git -C /tmp/test262 remote add origin https://github.com/tc39/test262
          git -C /tmp/test262 config core.sparseCheckout true
          printf 'test/language/\ntest/annexB/language/\n' > /tmp/test262/.git/info/sparse-checkout
          git -C /tmp/test262 fetch -q --depth 1 --filter=blob:none origin "$(cat test/test262.sha)"
          git -C /tmp/test262 checkout -q FETCH_HEAD
      - name: Build wasm + accuracy gate (every grammar)
        if: steps.changed.outputs.value == 'true'
        run: |
          for g in typescript typescriptreact javascript javascriptreact html yaml; do
            [ -f "tree-sitter/$g/tree-sitter-$g.wasm" ] || ( cd "tree-sitter/$g" && npx tree-sitter build --wasm . )
          done
          node test/treesitter-bench.ts
          node test/html-treesitter.ts
          node test/yaml-treesitter.ts
          node test/treesitter-queries.ts
          node test/treesitter-verdicts.ts
      # The wasms, for attributing a disagreement locally (delta debugging needs the built parser; the
      # dev box has no wasm toolchain).
      - name: Upload the wasms
        if: always() && steps.changed.outputs.value == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          retention-days: 7
          path: tree-sitter/*/tree-sitter-*.wasm
