name: measure profile

# The deterministic profile of the emitted Rust parser, A against M (test/bench-rust-profile/run.sh):
# Callgrind instructions per parse in both modes (a new CstBuilder per parse; one kept across
# parses), the lexer alone, work counters, allocator calls and bytes, page faults, peak memory; beside
# it the Go target's Callgrind instructions per parse (both modes) and the TS target's and emitted JS
# parser's V8 block executions per parse, side by side per input; and emitParser sizes for both real
# grammars and every target (test/emit-sizes.ts). The report goes to
# the job summary (test/bench-rust-profile/pr-summary.ts); the raw results are the run's artifact.
#
# - pull_request touching the parser sources, a grammar file or the harness: A = the merge base,
#   M = the pull request's head, PROFILE_SCOPE=pr (no oxc, no wall-clock, no cache simulation).
# - the label `measure-profile-full` on such a pull request: the same A and M, scope `full`: oxc
#   beside them, the native timings, the phase regions, the annotations, the cache/branch simulation.
# - push to a `land/**` branch touching the same paths: A = its merge base with master, M = its
#   head, scope `pr` (the check a pull request gets, without opening one).
# - workflow_dispatch: any two commits, either scope.
# Failure policy: a harness failure fails the job (a missing measurement is NOT RUN, never a pass);
# a regression is printed at the top of the summary and does not fail it (docs/MEASUREMENT.md).
# The wall-clock comparison with oxc is the separate, on-demand measure-bench workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - '*.ts'
      - 'test/bench-rust-profile/**'
      - 'test/bench-targets/**'
      - 'test/bench-rust-oxc/**'
      - 'test/oxc-parse-bench/**'
      - 'test/emit-sizes.ts'
      - '.github/workflows/measure-profile.yml'
  # A branch pushed for the full check without a pull request (see ci.yml): A = its merge base
  # with master, M = its head, scope `pr`.
  # No `paths:` here: on the push that CREATES a branch GitHub does not diff against master, so a
  # path filter can miss it. The `relevant` job below decides, against the merge base.
  push:
    branches: ['land/**']
  workflow_dispatch:
    inputs:
      commit:
        description: 'M: the commit to measure (sha, branch or tag)'
        required: true
      baseline:
        description: 'A: the commit to compare it with (default: its merge base with origin/master)'
        required: false
        default: ''
      scope:
        description: 'pr = deterministic A/M only (about 3.5 min); full = also oxc, native timings, regions, cache simulation (about 8 min)'
        type: choice
        options: [pr, full]
        default: pr

permissions:
  contents: read

concurrency:
  group: measure-profile-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.label.name || 'push' }}
  cancel-in-progress: true

# One pin for the TypeScript sources the harness downloads (same as ci.yml / readme-bench.yml).
env:
  TS_REPO_SHA: '6fbce89821d93a5b761581d9ac540455f38e9acb'

jobs:
  # For a `land/**` push: does the branch touch what this workflow measures, against its merge
  # base with master? (The same paths as the pull_request filter above.) Other events: yes.
  relevant:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: d
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin master; base=$(git merge-base origin/master HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^src/|^[^/]+\.ts$|^test/bench-rust-profile/|^test/bench-targets/|^test/bench-rust-oxc/|^test/oxc-parse-bench/|^test/emit-sizes\.ts$|^\.github/workflows/measure-profile\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "measured paths changed since $base"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing this workflow measures changed since $base"
          fi

  profile:
    needs: relevant
    # A label other than measure-profile-full changes nothing measured.
    if: needs.relevant.outputs.run == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'measure-profile-full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      # The Go target is measured beside the Rust one (run.sh, "Go and TS targets"); the version the
      # Go gates are recorded with (ci.yml).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - run: sudo apt-get update -q && sudo apt-get install -y -q valgrind

      - name: Choose A and M
        id: am
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_COMMIT: ${{ inputs.commit }}
          IN_BASELINE: ${{ inputs.baseline }}
          IN_SCOPE: ${{ inputs.scope }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'measure-profile-full') }}
        run: |
          set -euo pipefail
          git fetch -q origin master
          if [ "$EVENT" = pull_request ]; then
            M=$PR_HEAD; A=$(git merge-base "$PR_BASE" "$PR_HEAD")
            if [ "$FULL_LABEL" = true ]; then scope=full; else scope=pr; fi
          elif [ "$EVENT" = push ]; then
            M=$GITHUB_SHA; A=$(git merge-base origin/master "$M"); scope=pr
          else
            git fetch -q origin "$IN_COMMIT" 2>/dev/null || true
            M=$(git rev-parse "$IN_COMMIT^{commit}" 2>/dev/null || git rev-parse "origin/$IN_COMMIT^{commit}")
            if [ -n "$IN_BASELINE" ]; then
              git fetch -q origin "$IN_BASELINE" 2>/dev/null || true
              A=$(git rev-parse "$IN_BASELINE^{commit}" 2>/dev/null || git rev-parse "origin/$IN_BASELINE^{commit}")
            else
              A=$(git merge-base origin/master "$M")
            fi
            scope=$IN_SCOPE
          fi
          if git diff --name-only "$A" "$M" | grep -qE '^[^/]+\.ts$'; then grammar=1; else grammar=0; fi
          echo "A=$A" >> "$GITHUB_OUTPUT"; echo "M=$M" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"; echo "grammar_changed=$grammar" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
          echo "A = $(git log -1 --format='%h %s' "$A")"; echo "M = $(git log -1 --format='%h %s' "$M")"
          echo "scope = $scope, grammar file changed = $grammar"

      # The oxc crates (full scope only): the registry and their target directory, keyed on the
      # lockfile and the compiler. A hit saves the cold build of oxc_parser and its dependencies.
      - uses: actions/cache@v4
        if: steps.am.outputs.scope == 'full'
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/oxc-target
          key: oxc-profile-${{ runner.os }}-${{ hashFiles('test/oxc-parse-bench/Cargo.lock', 'test/bench-rust-profile/oxc-*/Cargo.toml') }}-${{ steps.am.outputs.rustc }}
          restore-keys: |
            oxc-profile-${{ runner.os }}-${{ hashFiles('test/oxc-parse-bench/Cargo.lock', 'test/bench-rust-profile/oxc-*/Cargo.toml') }}-

      - run: npm ci

      # The element inputs (jsx-corpus.tsx / .jsx) are built from its tests/cases
      # (test/bench-rust-profile/element-inputs.ts); the same sparse clone as ci.yml.
      - name: Clone the pinned TS corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/ts-repo; mkdir -p /tmp/ts-repo
          git -C /tmp/ts-repo init -q
          git -C /tmp/ts-repo remote add origin https://github.com/microsoft/TypeScript
          git -C /tmp/ts-repo config core.sparseCheckout true
          printf 'tests/cases/\n' > /tmp/ts-repo/.git/info/sparse-checkout
          git -C /tmp/ts-repo fetch -q --depth 1 --filter=blob:none origin "$TS_REPO_SHA"
          git -C /tmp/ts-repo checkout -q FETCH_HEAD

      # The step's limit is below the job's, so that a run which does not finish still reports what it
      # measured (the summary lists the rest as NOT RUN) and keeps its log and artifact.
      - name: Profile A and M
        timeout-minutes: 38
        run: test/bench-rust-profile/run.sh
        env:
          PROFILE_WORK: ${{ runner.temp }}/prof-work
          OXC_TARGET_DIR: ${{ runner.temp }}/oxc-target
          PROFILE_A: ${{ steps.am.outputs.A }}
          PROFILE_M: ${{ steps.am.outputs.M }}
          PROFILE_SCOPE: ${{ steps.am.outputs.scope }}

      - name: Emitted sizes of A and M
        if: ${{ always() && steps.am.outcome == 'success' }}
        run: |
          set -euo pipefail
          W='${{ runner.temp }}/prof-work'
          node test/emit-sizes.ts "$W/src-A" > "$W/out/emit-sizes-A.json"
          node test/emit-sizes.ts "$W/src-M" > "$W/out/emit-sizes-M.json"

      - name: Job summary
        if: ${{ always() && steps.am.outcome == 'success' }}
        env:
          GRAMMAR_CHANGED: ${{ steps.am.outputs.grammar_changed }}
          A: ${{ steps.am.outputs.A }}
          M: ${{ steps.am.outputs.M }}
          SCOPE: ${{ steps.am.outputs.scope }}
        run: |
          set -euo pipefail
          W='${{ runner.temp }}/prof-work'
          export PROFILE_A_LABEL="$(git log -1 --format='`%h` %s' "$A")"
          export PROFILE_M_LABEL="$(git log -1 --format='`%h` %s' "$M")"
          export RUNNER_CPU="$(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
          node test/bench-rust-profile/pr-summary.ts "$W/out/results.txt" "$W/out/emit-sizes-A.json" "$W/out/emit-sizes-M.json" "$W/src-M/docs/emit-sizes.json" > "$W/out/summary.md" || status=$?
          cat "$W/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '### Where the time went (run.sh phases, wall-clock seconds)'; echo '```'; cat "$W/out/phases.txt" 2>/dev/null || echo 'phases.txt missing: run.sh did not get past its first phase'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE" = full ]; then
            { echo; echo '### Full profile (oxc beside A and M; test/bench-rust-profile/summarize.ts)'; echo '```'; cat "$W/out/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-profile
          path: ${{ runner.temp }}/prof-work/out
          if-no-files-found: warn
