name: bench rust vs oxc

# One-off measurement: monogram's emitted Rust TypeScript parser at several commits vs oxc,
# alternating rounds in one job (test/bench-rust-oxc/run.sh). Runs only on pushes to its own
# branch; never on master or pull requests.
on:
  push:
    branches: [bench/rust-vs-oxc]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # BENCH_EXTRA: c65e2a2bfabdf6c6d350b5d99ec1ca2e3585e852
      - run: test/bench-rust-oxc/run.sh 9
        env:
          BENCH_EXTRA: c65e2a2bfabdf6c6d350b5d99ec1ca2e3585e852
          BENCH_ONLY: '1'
