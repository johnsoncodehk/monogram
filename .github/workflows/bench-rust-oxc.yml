name: bench rust vs oxc

# One-off measurement: monogram's emitted Rust TypeScript parser at several commits vs oxc,
# alternating rounds in one job (test/bench-rust-oxc/run.sh). Runs only on pushes to its own
# branch; never on master or pull requests.
on:
  push:
    branches: [bench/rust-vs-oxc]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # BENCH_EXTRA: a commit to time as variant E against D (origin/master); BENCH_GRAMMAR: typescript (default) or javascript. Edit per measurement.
      - run: test/bench-rust-oxc/run.sh 9
        env:
          BENCH_EXTRA: 94c6b991f8a599951436fb536ee8a36b8a0dbdfe
          BENCH_ONLY: '1'
          BENCH_GRAMMAR: typescript
