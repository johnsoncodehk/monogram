name: bench rust vs oxc

# One-off measurement: monogram's emitted Rust TypeScript parser at several commits vs oxc,
# alternating rounds in one job (test/bench-rust-oxc/run.sh). Runs only on pushes to its own
# branch; never on master or pull requests.
on:
  push:
    branches: [bench/rust-vs-oxc, bench/perf-rust-longest-match-blowup]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # BENCH_EXTRA: a commit to time as variant E against D (origin/master); edit per measurement.
      - run: test/bench-rust-oxc/run.sh 9
        env:
          BENCH_EXTRA: b0c5dad3fb43b3faa7fa85c68babe7829931f3f7
