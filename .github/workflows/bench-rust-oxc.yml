name: bench rust vs oxc

# One-off measurement: monogram's emitted Rust TypeScript parser at several commits vs oxc,
# alternating rounds in one job (test/bench-rust-oxc/run.sh). Runs only on pushes to its own
# branch; never on master or pull requests.
on:
  push:
    branches: [bench/rust-vs-oxc]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # BENCH_EXTRA: 0807b8143ad160773842ef67bb3faea730ff28a6
      - run: test/bench-rust-oxc/run.sh 9
        env:
          BENCH_EXTRA: a6221237e9a1636b49a5b6f1ff3007d32d227eaa
          BENCH_ONLY: '1'
